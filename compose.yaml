services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: market_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000